<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 790" fill="none"><title>可复用SVG组件库：定义位于defs中</title>
<defs>
  <!-- Shared palette; all coordinates and effects remain editable. -->
  <radialGradient id="nh-star-color" cx="0" cy="0" r="54" gradientUnits="userSpaceOnUse">
    <stop stop-color="#f9ffde"/><stop offset=".65" stop-color="#fcffe9"/><stop offset="1" stop-color="#fffff7"/>
  </radialGradient>
  <linearGradient id="nh-leaf-color" x1=".1" y1="1" x2=".8" y2="0">
    <stop stop-color="#d5edb3" stop-opacity=".65"/><stop offset=".5" stop-color="#e8f8cf" stop-opacity=".9"/><stop offset="1" stop-color="#f6fbe4"/>
  </linearGradient>
  <linearGradient id="nh-stem-color">
    <stop stop-color="#dbffa3" stop-opacity=".72"/><stop offset=".5" stop-color="#f3ffce"/><stop offset="1" stop-color="#e4ffac" stop-opacity=".92"/>
  </linearGradient>
  <filter id="nh-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="wide"/>
    <feFlood flood-color="#a9ff54" flood-opacity=".65"/><feComposite in2="wide" operator="in" result="halo"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="near"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="near"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="nh-vine-glow" x="-140%" y="-8%" width="380%" height="116%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="wide"/>
    <feFlood flood-color="#c5ff79" flood-opacity=".6"/><feComposite in2="wide" operator="in" result="halo"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation=".9" result="near"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="near"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- Four pointed lobes and four transparent, curved leaf-shaped apertures. -->
  <g id="nh-star-geometry">
    <path d="M 0,-54 C 15,-42 23,-29 18,-18 C 29,-23 42,-15 54,0 C 42,15 29,23 18,18 C 23,29 15,42 0,54 C -15,42 -23,29 -18,18 C -29,23 -42,15 -54,0 C -42,-15 -29,-23 -18,-18 C -23,-29 -15,-42 0,-54 Z" fill="#d9ff8c" fill-opacity=".13"/>
    <path d="M 0,-54 C 15,-42 23,-29 18,-18 C 29,-23 42,-15 54,0 C 42,15 29,23 18,18 C 23,29 15,42 0,54 C -15,42 -23,29 -18,18 C -29,23 -42,15 -54,0 C -42,-15 -29,-23 -18,-18 C -23,-29 -15,-42 0,-54 Z M 0,-47 C -14,-34 -14,-19 0,-4 C 14,-19 14,-34 0,-47 Z M 47,0 C 34,-14 19,-14 4,0 C 19,14 34,14 47,0 Z M 0,47 C 14,34 14,19 0,4 C -14,19 -14,34 0,47 Z M -47,0 C -34,14 -19,14 -4,0 C -19,-14 -34,-14 -47,0 Z" fill="url(#nh-star-color)" fill-rule="evenodd" stroke="#fffff5" stroke-width=".65" stroke-linejoin="round"/>
    <path d="M 0,-54 C 15,-42 23,-29 18,-18 C 29,-23 42,-15 54,0 C 42,15 29,23 18,18 C 23,29 15,42 0,54 C -15,42 -23,29 -18,18 C -29,23 -42,15 -54,0 C -42,-15 -29,-23 -18,-18 C -23,-29 -15,-42 0,-54 Z" fill="none" stroke="#fffffa" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <g id="nh-star" filter="url(#nh-glow)"><use xlink:href="#nh-star-geometry"/></g>
  <!-- Leaf base at 0,0; pointed tip at 28,-46. Asymmetric folded blade. -->
  <g id="nh-leaf-geometry">
    <path d="M 0,0 C -13,-17 -11,-39 5,-45 C 14,-49 22,-45 28,-46 C 25,-37 27,-25 19,-16 C 12,-8 5,-5 0,0 Z" fill="url(#nh-leaf-color)"/>
    <path d="M 0,0 C 4,-17 14,-34 28,-46 C 13,-38 1,-21 0,0 Z" fill="#f6ffd2" fill-opacity=".63"/>
    <path d="M 0,0 C -13,-17 -11,-39 5,-45 C 14,-49 22,-45 28,-46" fill="none" stroke="#eef8d9" stroke-width=".8" stroke-opacity=".8"/>
    <path d="M 0,0 C 4,-17 14,-34 28,-46" fill="none" stroke="#f5ffc7" stroke-width=".8"/>
  </g>
  <g id="nh-leaf" filter="url(#nh-glow)"><use xlink:href="#nh-leaf-geometry"/></g>
  <g id="nh-leaf-pair">
    <use xlink:href="#nh-leaf" transform="rotate(35) scale(.86)"/>
    <use xlink:href="#nh-leaf" transform="scale(-1 1) rotate(15) scale(.7)"/>
    <path d="M 0,8 Q -1,2 0,-5" fill="none" stroke="#e3ffa5" stroke-width="1.3"/>
  </g>
  <g id="nh-spark" fill="#f5ffcd" filter="url(#nh-glow)">
    <path d="M 0,-9 Q 1,-1 6,0 Q 1,1 0,9 Q -1,1 -6,0 Q -1,-1 0,-9Z"/>
  </g>
  <!-- One upright only: rectangle + two interlaced cubic Bezier vines. -->
  <g id="nh-handrail" opacity=".55">
    <g filter="url(#nh-vine-glow)">
      <path id="nh-vine-back" d="M 8,0 C -24,54 -23,89 0,140 S 25,221 0,280 S -25,361 0,420 S 25,501 0,560 S -25,641 -6,700" fill="none" stroke="#e5ffb5" stroke-width="2.3" stroke-opacity=".86"/>
      <rect id="nh-upright" x="-4.2" y="0" width="8.4" height="700" rx="1.2" fill="url(#nh-stem-color)"/>
      <path d="M -1.8,0 V 700" fill="none" stroke="#fbffe4" stroke-width="1" stroke-opacity=".48"/>
      <path id="nh-vine-front" d="M -8,0 C 25,54 23,89 0,140 S -25,221 0,280 S 25,361 0,420 S -25,501 0,560 S 25,641 6,700" fill="none" stroke="#f4ffd0" stroke-width="5.4" stroke-linecap="round"/>
      <path d="M -8,0 C 25,54 23,89 0,140 S -25,221 0,280 S 25,361 0,420 S -25,501 0,560 S 25,641 6,700" fill="none" stroke="#fdffeb" stroke-width="1.1" stroke-opacity=".82"/>
    </g>
    <use xlink:href="#nh-leaf" transform="translate(14 72) rotate(17) scale(.55)"/>
    <use xlink:href="#nh-leaf" transform="translate(-12 252) rotate(-72) scale(.83)"/>
    <use xlink:href="#nh-leaf" transform="translate(5 403) rotate(70) scale(.85)"/>
    <use xlink:href="#nh-leaf" transform="translate(-9 578) rotate(-66) scale(.58)"/>
    <g fill="#eaffad" filter="url(#nh-glow)">
      <circle cx="-20" cy="103" r="2"/><circle cx="-24" cy="111" r="1.4"/>
      <circle cx="20" cy="327" r="2.6"/><circle cx="25" cy="319" r="1.8"/>
      <circle cx="-20" cy="482" r="1.9"/><circle cx="-24" cy="493" r="1.1"/>
    </g>
  </g>
</defs>
<use xlink:href="#nh-handrail" transform="translate(130 45)"/>
<use xlink:href="#nh-star" transform="translate(130 525) scale(.91) rotate(3)"/>
<use xlink:href="#nh-star" transform="translate(176 422) scale(.52) rotate(17)"/>
<use xlink:href="#nh-star" transform="translate(91 166) scale(.22) rotate(-13)"/>
<use xlink:href="#nh-star" transform="translate(170 648) scale(.32) rotate(-15)"/>
<use xlink:href="#nh-spark" transform="translate(84 342) scale(.65)"/>
<use xlink:href="#nh-spark" transform="translate(177 262) scale(.48)"/>
</svg>